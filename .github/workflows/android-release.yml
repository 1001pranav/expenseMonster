name: Android production build

# Builds the sideloadable production APK. Cloud sync is compiled in from
# the DEV environment's EXPO_PUBLIC_* values and stays off until the user enables it.
# Push a tag like v1.0.0 to publish it as a GitHub Release. Pushes to `mobile` build an artifact only.
on:
  push:
    tags: ['v*']
    # Every push to the app branch also builds (artifact only, no release) as a native-build check.
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same ref supersedes an in-progress build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (actions/runner-images#14748).
    # Bump this deliberately, with a test build, rather than letting the label move under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Secrets and variables come from this GitHub environment (repo-level ones still apply).
    environment: DEV
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7

      # Build config comes from the DEV environment (Settings → Environments → DEV), in either form:
      #   - APP_ENV secret: the contents of a .env.local file (see .env.example), or
      #   - one variable or secret per key, e.g. EXPO_PUBLIC_SUPABASE_URL (these win over APP_ENV).
      # Written before the tests so the "no service_role key" check sees the real values.
      - name: Load app environment
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          ENV_VARS: ${{ toJSON(vars) }}
          ENV_SECRETS: ${{ toJSON(secrets) }}
        run: |
          {
            # Drop Windows line endings, comments, blank lines and surrounding quotes.
            printf '%s\n' "$APP_ENV" | tr -d '\r' | { grep -E '^[A-Z0-9_]+=' || true; } \
              | sed -E "s/^([A-Z0-9_]+)=[\"']?([^\"']*)[\"']?[[:space:]]*$/\1=\2/"
            for j in "$ENV_SECRETS" "$ENV_VARS"; do
              printf '%s' "$j" | jq -r 'to_entries[] | select(.key | startswith("EXPO_PUBLIC_"))
                | "\(.key)=\(.value | gsub("^\\s+|\\s+$"; ""))"'
            done
          } | awk -F= '{ v[$1] = $0; if (!($1 in seen)) { seen[$1] = 1; k[++n] = $1 } }
                       END { for (i = 1; i <= n; i++) print v[k[i]] }' > .env.local
          if [ -n "$APP_ENV" ] && ! printf '%s\n' "$APP_ENV" | grep -qE '^EXPO_PUBLIC_'; then
            echo "::error::APP_ENV has no EXPO_PUBLIC_ lines. Copy the format of .env.example."; exit 1
          fi
          if ! grep -qE '^EXPO_PUBLIC_' .env.local; then
            rm .env.local
            echo "::notice::No EXPO_PUBLIC_ values in the DEV environment: building without cloud sync."
            exit 0
          fi
          # Expo reads .env.local; exporting too covers the Gradle-driven bundling step.
          grep -E '^EXPO_PUBLIC_' .env.local >> "$GITHUB_ENV"
          echo "Loaded: $(cut -d= -f1 .env.local | paste -sd ' ' -)"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Table of every build setting: present / missing / wrong, never the values (also shown on
      # the run's Summary page). Fails here, in seconds, if a value is set but wrong.
      - name: Check build configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_IN_VARS: >-
            ${{ vars.ANDROID_KEYSTORE_BASE64 && 'ANDROID_KEYSTORE_BASE64' || '' }}
            ${{ vars.ANDROID_KEYSTORE_PASSWORD && 'ANDROID_KEYSTORE_PASSWORD' || '' }}
            ${{ vars.ANDROID_KEY_PASSWORD && 'ANDROID_KEY_PASSWORD' || '' }}
        run: bash scripts/ci/check-build-env.sh

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx eslint .
          npx jest

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install --clean

      # After prebuild: the Gradle cache key hashes the build files, and android/ only exists
      # once prebuild has generated it (the repo itself has no *.gradle files).
      # v6 defaults to a proprietary cache provider (free-preview only on private repos);
      # "basic" is the MIT one built on actions/cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release APK
        working-directory: android
        # Real phones are ARM; leaving out the x86 emulator ABIs roughly halves the APK.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Sign with your own key when the secrets are set. Otherwise the APK keeps Expo's default
      # debug signature, which differs on every run: installing a later build would then need
      # an uninstall, and that deletes all on-phone data.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The alias isn't secret, so a variable works too; if neither is set, the check step
          # picks the keystore's only key. PKCS12 keystores (keytool's default) use the keystore
          # password for the key, so ANDROID_KEY_PASSWORD is optional.
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS || env.DETECTED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT=ExpenseMonster-${GITHUB_REF_NAME//\//-}.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            ANDROID_KEYSTORE_BASE64="$KEYSTORE_BASE64" bash scripts/ci/decode-keystore.sh release.keystore
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" aligned.apk
            "$BT/apksigner" verify "$OUT"
            rm release.keystore
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            cp "$APK" "$OUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: APK is debug-signed. Don't keep real data in it; future builds won't install over it."
            echo "SIGNING=debug key (temporary — see README)" >> "$GITHUB_ENV"
          fi
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ExpenseMonster-apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_FILE }}
          body: |
            Production APK (sideload). Signed with: ${{ env.SIGNING }}.
            - Data stays on the phone unless you turn on cloud sync, which uploads only end-to-end encrypted household changes.
            Install: download on the phone → open → allow "Install unknown apps" for your browser/Files app.
